<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Italy Trip Planner</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />

    <!-- same CSS as proto; you’ll serve /styles from your server -->
    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/page.css" />
    <link rel="stylesheet" href="/styles/homePage.css" />
  </head>

  <body>
    <mu-history provides="traveling:history">
      <mu-auth provides="traveling:auth">
        <mu-store provides="traveling:model">
          <mu-switch></mu-switch>
        </mu-store>
      </mu-auth>
    </mu-history>

    <!-- SPA entry -->
    <script type="module" src="/src/main.ts"></script>
    <!-- your old dark-mode / global behavior script can stay -->
    <script src="/scripts/home.js"></script>
  </body>
</html>
